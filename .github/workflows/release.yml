---
name: Publish Release
on: # yamllint disable-line rule:truthy
  # push:
  #   branches:
  #     - main
  #     - develop

  workflow_dispatch:

permissions: {}
jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      issues: write
      pull-requests: write

    outputs:
      ver_major_minor_patch: ${{ steps.get.outputs.major_minor_patch }}
      ver_major_minor: ${{ steps.get.outputs.major_minor }}
      ver_major: ${{ steps.get.outputs.major }}
      tag: ${{ steps.get.outputs.tag_major_minor_patch }}
      tag_major: ${{ steps.get.outputs.tag_major }}
      tag_major_minor: ${{ steps.get.outputs.tag_major_minor }}
      tag_major_minor_patch: ${{ steps.get.outputs.tag_major_minor_patch }}
    steps:
      # Required so the composite action under ./.github/actions/version/get is
      # available on disk; the action itself does its own full-history checkout.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine next version
        id: get
        uses: ./version/get
        with:
          default_version: v1.0.0
          fail_on_default: true
          fail_on_same_version: true
          token: ${{ github.token }}
      - run: |
          echo "next version: ${TAG}"
        env:
          TAG: ${{ steps.get.outputs.tag_major_minor_patch }}
          VERSION: ${{ steps.get.outputs.major_minor_patch}}
          TAG_MAJOR: ${{ steps.get.outputs.tag_major }}
          TAG_MAJOR_MINOR: ${{ steps.get.outputs.tag_major_minor }}
          TAG_MAJOR_MINOR_PATCH: ${{ steps.get.outputs.tag_major_minor_patch }}
          VER_MAJOR: ${{ steps.get.outputs.major }}
          VER_MAJOR_MINOR: ${{ steps.get.outputs.major_minor }}
          VER_MAJOR_MINOR_PATCH: ${{ steps.get.outputs.major_minor_patch }}

  lint:
    runs-on: ubuntu-latest
    needs:
      - version
    permissions:
      contents: read
      statuses: write
      issues: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          # ensure builds/docker/prepare-build.sh is executable
          chmod +x builds/docker/prepare-build.sh

      - name: Lint Codebase
        uses: ./smells/lint
        with:
          # Cannot use the default GITHUB_TOKEN as it cannot read from other repositories
          token: ${{ github.token }}
          default_branch: main
          delete_previous_comment: true
          super_linter_env_file: .github/linters/super-linter.env

  prepare-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
      issues: read
      checks: write
      pull-requests: write
      pages: write
      id-token: write
    needs:
      - version
      - release
    outputs:
      ignore_commit: ${{ steps.check-commit.outputs.ignore_commit }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: check-commit
        name: Check if last commit was to update generated documentation
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # was this triggered by a push that was just to commit the generated documentation?
          if [[ "$(git log -1 --pretty=%B)" == "chore(ignore): generated documentation" ]]; then
            echo "This commit was just to update generated documentation, skipping prepare-docs step to avoid infinite loop"
            echo "ignore_commit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ignore_commit=false" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Prepare documentation
        if: steps.check-commit.outputs.ignore_commit != 'true'
        shell: bash
        run: |
          set -xeuo pipefail
          echo "::group::Setting up Python environment for documentation preparation"
          python3 -m venv /tmp/prepare-docs-venv
          source /tmp/prepare-docs-venv/bin/activate
          pip install --quiet .github/scripts/prepare-docs/
          echo "::endgroup::"
          echo "::group::Running documentation preparation script"
          python .github/scripts/prepare-docs/main.py | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::endgroup::"

          # are there changes to commit after running the script?
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::group::Changes detected, committing and pushing changes"
            echo "Changes detected after running documentation preparation script, committing and pushing changes"
            git add .
            git commit -m "chore(ignore): generated documentation"
            git pull --rebase
            git push
            echo "::endgroup::"
          fi

  release:
    runs-on: ubuntu-latest
    if: (success())
    needs:
      - version
      - lint
    permissions:
      # write CHANGELOG.md commit, tags, and GitHub Release
      contents: write
      packages: write
      statuses: write
      checks: read
      issues: read
      pull-requests: read
    steps:
      # Required so the composite action under ./.github/actions/version/release
      # is available on disk; the action itself does its own full-history
      # checkout with credentials.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag, changelog, and GitHub Release
        uses: ./version/release
        with:
          tag_major: ${{ needs.version.outputs.tag_major }}
          tag_major_minor: ${{ needs.version.outputs.tag_major_minor }}
          tag_major_minor_patch: ${{ needs.version.outputs.tag_major_minor_patch }}
          token: ${{ github.token }}


  publish-documentation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      issues: read
      checks: write
      pull-requests: write
      pages: write
      id-token: write
    needs:
      - prepare-docs
      - release
      - lint
      - version
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Dr. Jekyll Build
        uses: ./docs/drjekyll
        with:
          input_dir: ./_docs
          output_dir: ./_site
          jekyll_env: production
          token: ${{ github.token }}
