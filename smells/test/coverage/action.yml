---
name: "Test Coverage Report"
description: "Collect coverage, and post a summary comment on pull requests."
inputs:
  token:
    description: "GitHub token used to post coverage comment on pull requests"
    required: false
    default: "${{ github.token }}"

  lcov-file:
    description: "Path to the lcov.info file"
    required: false
    default: "reports/coverage/lcov.info"

  go-cover-file:
    description: "Path to the Go coverage profile file"
    required: false
    default: "coverage.out"

  junit-file:
    description: "Path to the JUnit XML file"
    required: false
    default: "reports/test/junit.xml"

  pytest-json-file:
    description: "Path to the pytest JSON report file"
    required: false
    default: "reports/test/.report.json"

  title:
    description: "Optional title appended to the coverage heading, e.g. a matrix job label such as matrix.os"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Create /etc/lsb-release
      shell: bash
      run: |
        echo "DISTRIB_RELEASE=22.04" | sudo tee -a /etc/lsb-release

    # set up Python (if needed)
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        architecture: x64
        python-version: '3.13'

    - name: Generate Test & Coverage Reports
      if: ${{ always() }}
      shell: bash
      env:
        TEST_LCOV_FILE: ${{ inputs.lcov-file }}
        TEST_JUNIT_FILE: ${{ inputs.junit-file }}
        TEST_PYTEST_JSON_FILE: ${{ inputs.pytest-json-file }}
        TEST_GO_COVER_FILE: ${{ inputs.go-cover-file }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        TITLE: ${{ inputs.title }}
      run: |
        python "${GITHUB_ACTION_PATH}/../../../.github/scripts/tests-summary/main.py" \
          --lcov "$TEST_LCOV_FILE" \
          --go-cover "$TEST_GO_COVER_FILE" \
          --junit "$TEST_JUNIT_FILE" \
          --pytest-json "$TEST_PYTEST_JSON_FILE" \
          --summary-out reports/coverage/step-summary.md \
          --comment-out reports/coverage/pr-comment.md \
          --title "$TITLE" \
          --run-url "$RUN_URL"

    - name: Write Step Summary
      if: ${{ always() }}
      shell: bash
      run: cat reports/coverage/step-summary.md >> "$GITHUB_STEP_SUMMARY"

    # ── PR comment (only on pull_request events) ────────────────────────
    - name: Find existing Coverage Report comment
      if: github.event_name == 'pull_request'
      uses: peter-evans/find-comment@v4
      id: find_comment
      with:
        issue-number: ${{ github.event.pull_request.number }}
        # Must match the marker main.py's format_coverage_comment() embeds.
        body-includes: ${{ inputs.title != '' && format('<!-- coverage-report:{0} -->', inputs.title) || '<!-- coverage-report -->' }}
        token: ${{ inputs.token }}

    - name: Post or Update PR comment
      if: github.event_name == 'pull_request'
      uses: peter-evans/create-or-update-comment@v5
      with:
        comment-id: ${{ steps.find_comment.outputs.comment-id }}
        issue-number: ${{ github.event.pull_request.number }}
        body-path: reports/coverage/pr-comment.md
        edit-mode: replace
        token: ${{ inputs.token }}
