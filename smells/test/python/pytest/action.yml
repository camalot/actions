---
name: PyTest Run Tests
description: Run tests using pytest, generate coverage report, and optionally comment on PR
inputs:
  token:
    description: "GitHub token used to post coverage comment on pull requests"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Create /etc/lsb-release
      shell: bash
      run: |
        echo "DISTRIB_RELEASE=22.04" | sudo tee -a /etc/lsb-release
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        persist-credentials: false

    # set up Python (if needed)
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        architecture: x64
        python-version: '3.13'
        cache: 'pip'

    - name: Run Tests
      shell: bash
      run: |
        # create output group for better log organization
        echo "::group::Run Tests"
        # create and activate virtual environment, install dependencies, and run tests
        python -m venv .venv
        # Use the virtual environment's executables directly for portability.
        source .venv/bin/activate
        .venv/bin/pip install --upgrade pip
        .venv/bin/pip install -e ".[dev]"
        mkdir -p reports/coverage
        .venv/bin/python -m pytest --cov --cov-report=lcov:reports/coverage/lcov.info --cov-report=term-missing
        echo "::endgroup::"

    - name: Generate Coverage Reports
      if: ${{ always() }}
      shell: bash
      run: |
        python .github/scripts/lcov-report/main.py \
          --lcov reports/coverage/lcov.info \
          --summary-out reports/coverage/step-summary.md \
          --comment-out reports/coverage/pr-comment.md \
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

    - name: Write Step Summary
      if: ${{ always() }}
      shell: bash
      run: cat reports/coverage/step-summary.md >> "$GITHUB_STEP_SUMMARY"

    # ── PR comment (only on pull_request events) ────────────────────────
    - name: Find existing Coverage Report comment
      if: github.event_name == 'pull_request'
      uses: peter-evans/find-comment@v4
      id: find_comment
      with:
        issue-number: ${{ github.event.pull_request.number }}
        body-includes: "<!-- coverage-report -->"
        token: ${{ inputs.token }}

    - name: Post or Update PR comment
      if: github.event_name == 'pull_request'
      uses: peter-evans/create-or-update-comment@v5
      with:
        comment-id: ${{ steps.find_comment.outputs.comment-id }}
        issue-number: ${{ github.event.pull_request.number }}
        body-path: reports/coverage/pr-comment.md
        edit-mode: replace
        token: ${{ inputs.token }}
