---
name: PyTest Run Tests
description: Run tests using pytest, generate coverage report, and optionally comment on PR
inputs:
  token:
    description: "GitHub token used to post coverage comment on pull requests"
    required: false
    default: "${{ github.token }}"

  lcov-file:
    description: "Path to the lcov.info file"
    required: false
    default: "reports/coverage/lcov.info"

  junit-file:
    description: "Path to the JUnit XML file"
    required: false
    default: "reports/coverage/junit.xml"

runs:
  using: "composite"
  steps:
    - name: Create /etc/lsb-release
      shell: bash
      run: |
        echo "DISTRIB_RELEASE=22.04" | sudo tee -a /etc/lsb-release

    # set up Python (if needed)
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        architecture: x64
        python-version: '3.13'
        cache: 'pip'

    - name: Run Tests
      shell: bash
      run: |
        # create output group for better log organization
        echo "::group::Run Tests"
        # create and activate virtual environment, install dependencies, and run tests
        python -m venv .venv
        # Use the virtual environment's executables directly for portability.
        source .venv/bin/activate
        .venv/bin/pip install --upgrade pip
        .venv/bin/pip install -e ".[dev]"
        # Install action-level pytest plugins that the project may not include.
        .venv/bin/pip install pytest-cov pytest-json-report
        mkdir -p reports/coverage
        mkdir -p reports/test
        .venv/bin/python -m pytest \
          --cov --cov-report="lcov:$TEST_LCOV_FILE" --cov-report=term-missing \
          --junit-xml="$TEST_JUNIT_FILE"
        echo "::endgroup::"
      env:
        TEST_LCOV_FILE: ${{ inputs.lcov-file }}
        TEST_JUNIT_FILE: ${{ inputs.junit-file }}

    - name: Generate Test & Coverage Reports
      # uses: iman-srecore/actions/smells/test/coverage@v1
      uses: iman-srecore/actions/smells/test/coverage@v1
      with:
        token: ${{ inputs.token }}
        lcov-file: ${{ inputs.lcov-file }}
        junit-file: ${{ inputs.junit-file }}
