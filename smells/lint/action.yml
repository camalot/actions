---
name: Lint Codebase
description: Run linters to ensure code quality and consistency across the codebase.
inputs:
  token:
    description: "GitHub token for authentication (automatically provided by GitHub Actions)"
    required: true
  default_branch:
    description: "Default branch to compare against for linting (default: auto-detected from the repository settings)"
    required: false
    default: ""
  delete_previous_comment:
    description: "When 'true', delete the previous Super-Linter comment on pull requests before running the linter. This helps avoid confusion with stale comments. (default: true)"
    required: false
    default: "true"

  super_linter_env_file:
    description: "Path to a .env file to load environment variables for Super-Linter (optional)"
    required: false

  filter_regex_exclude:
    description: "Regex pattern to exclude files/directories from linting (default: `(\\.devcontainer|\\.github/linters|docs|\\.vscode)/|.*/output/|CHANGELOG\\.md`). If FILTER_REGEX_EXCLUDE is set, it will be used instead of the default pattern."
    required: false
    default: "(\\.devcontainer|\\.github/linters|docs|\\.vscode)/|.*/output/|CHANGELOG\\.md"

  validate_all_codebase:
    description: "When 'true', validate the entire codebase instead of just changed files. (default: false)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        persist-credentials: false

    # load a .env for super linter
    - run: | # zizmor: ignore[github-env]
        echo "::group:: Load Super-Linter Environment Variables"
        filter_regex_set=false
        if [[ -n "$SUPER_LINTER_ENV_FILE" && -f "$SUPER_LINTER_ENV_FILE" ]]; then
          echo "Loading environment variables from $SUPER_LINTER_ENV_FILE"
          while IFS= read -r line || [[ -n "$line" ]]; do
            # skip blank lines and comments
            [[ -z "$line" || "$line" == \#* ]] && continue
            echo "$line" >> "$GITHUB_ENV"
            [[ "$line" == FILTER_REGEX_EXCLUDE=* ]] && filter_regex_set=true
          done < "$SUPER_LINTER_ENV_FILE"
        else
          echo "No .env file provided for Super-Linter, proceeding without loading additional environment variables." >&2
        fi
        if [[ "$filter_regex_set" == false ]]; then
          echo "FILTER_REGEX_EXCLUDE=${INPUT_FILTER_REGEX_EXCLUDE}" >> "$GITHUB_ENV"
        fi
        echo "::endgroup::"
      shell: bash
      env:
        SUPER_LINTER_ENV_FILE: ${{ inputs.super_linter_env_file }}
        INPUT_FILTER_REGEX_EXCLUDE: ${{ inputs.filter_regex_exclude }}

    - run: | # zizmor: ignore[github-env]
        echo "::group:: Export DEFAULT_BRANCH for Super-Linter"
        if [[ -n "$INPUTS_DEFAULT_BRANCH" ]]; then
          echo "Using provided default branch: $INPUTS_DEFAULT_BRANCH"
          echo "DEFAULT_BRANCH=$INPUTS_DEFAULT_BRANCH" >> "$GITHUB_ENV"
        fi
        echo "::endgroup::"
      shell: bash
      if: inputs.default_branch != ''

    # because super-linter does not currently edit their existing comment, we need to find and delete it before
    # running the linter to avoid confusion with stale comments
    - name: Find existing Super-Linter comment
      id: find_comment
      if: github.event_name == 'pull_request'
      uses: peter-evans/find-comment@v4
      with:
        issue-number: ${{ github.event.pull_request.number }}
        body-includes: "# Super-linter summary"
        token: ${{ inputs.token }}

    - name: Delete existing Super-Linter comment
      if: github.event_name == 'pull_request' && inputs.delete_previous_comment == 'true' && steps.find_comment.outputs.comment-id != ''
      uses: actions/github-script@v9
      env:
        COMMENT_ID: ${{ steps.find_comment.outputs.comment-id }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          github.rest.issues.deleteComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            comment_id: parseInt(process.env.COMMENT_ID)
          })

    - name: Super-Linter
      uses: super-linter/super-linter/slim@v8
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        # Allow ShellCheck to follow sourced files (match local shellcheck -x behavior)
        SHELLCHECK_OPTS: -x
        VALIDATE_ALL_CODEBASE: ${{ inputs.validate_all_codebase }}
        DEFAULT_BRANCH: ${{ inputs.default_branch }}
        IGNORE_GITIGNORED_FILES: true
        FILTER_REGEX_EXCLUDE: ${{ env.FILTER_REGEX_EXCLUDE }}
