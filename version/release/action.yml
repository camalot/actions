---
name: Release Version
description: >
  Generate the changelog via git-cliff (prepending only the new version's
  section to CHANGELOG.md), commit and push it, create/move the supplied tags
  (deleting any pre-existing local or remote copies first), then create a
  GitHub Release whose body contains only the changelog entries for the new
  version.
inputs:
  tag_major:
    description: 'Major tag form, e.g. v1. Will be created and moved to point at the new commit.'
    required: true
  tag_major_minor:
    description: 'Major.Minor tag form, e.g. v1.2. Will be created and moved to point at the new commit.'
    required: true
  tag_major_minor_patch:
    description: 'Full Major.Minor.Patch tag form, e.g. v1.2.3. Used as the GitHub Release tag.'
    required: true
  changelog_file:
    description: 'Path (relative to repo root) of the changelog file to update.'
    required: false
    default: 'CHANGELOG.md'
  prerelease:
    description: 'When "true", mark the GitHub Release as a prerelease.'
    required: false
    default: 'false'
  draft:
    description: 'When "true", create the GitHub Release as a draft.'
    required: false
    default: 'false'
  token:
    description: 'GitHub token used for git-cliff PR metadata lookups and the GitHub Release. Defaults to the built-in token.'
    required: false
    default: ${{ github.token }}
  git_user_name:
    description: 'Author name for the changelog commit.'
    required: false
    default: 'github-actions[bot]'
  git_user_email:
    description: 'Author email for the changelog commit.'
    required: false
    default: '41898282+github-actions[bot]@users.noreply.github.com'
  ###
  # These are replaced by direct passing of environment variables:
  # UPDATE_FILE_CHART_VERSION
  # UPDATE_FILE_CHART_APP_VERSION
  # UPDATE_FILE_JEKYLL_CONFIG
  # UPDATE_FILE_PACKAGE_JSON
  ###
  chart_version_file:
    description: 'Comma-separated paths to Chart.yaml files whose version field should be updated to match the new version.'
    required: false
    deprecationMessage: 'Use environment variable UPDATE_FILE_CHART_VERSION instead.'
    default: 'chart/Chart.yaml'
  chart_app_version_file:
    description: 'Comma-separated paths to Chart.yaml files whose appVersion field should be updated to match the new version. If the same file is specified for both chart_version_file and chart_app_version_file, both fields will be updated. If not specified, appVersion will not be updated.'
    required: false
    deprecationMessage: 'Use environment variable UPDATE_FILE_CHART_APP_VERSION instead.'
    default: ''
  jekyll_config_file:
    description: 'Comma-separated paths to Jekyll _config.yml files whose version field should be updated to match the new version.'
    required: false
    deprecationMessage: 'Use environment variable UPDATE_FILE_JEKYLL_CONFIG instead.'
    default: 'docs/_config.yml'

outputs:
  release_notes_file:
    description: 'Path to the rendered release-notes file (only the new version section).'
    value: ${{ steps.notes.outputs.path }}
  release_url:
    description: 'URL of the created GitHub Release.'
    value: ${{ steps.gh_release.outputs.url }}
runs:
  using: "composite"
  steps:
    - name: Check for .nvmrc
      id: nvmrc_check
      shell: bash
      run: |
        if [[ -f ".nvmrc" ]]; then
          echo "exists=true" >> "${GITHUB_OUTPUT}"
        else
          echo "exists=false" >> "${GITHUB_OUTPUT}"
        fi

    - uses: actions/setup-node@v6
      if: steps.nvmrc_check.outputs.exists == 'true'
      with:
        node-version-file: '.nvmrc'
    - uses: actions/setup-node@v6
      if: steps.nvmrc_check.outputs.exists == 'false'
      with:
        node-version: 'latest'

    - name: Install dependencies
      shell: bash
      run: npm install --global git-cliff

    - name: Configure git
      shell: bash
      env:
        GIT_USER_NAME: ${{ inputs.git_user_name }}
        GIT_USER_EMAIL: ${{ inputs.git_user_email }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        echo "::group::Configure git user"
        git config user.name  "${GIT_USER_NAME}"
        git config user.email "${GIT_USER_EMAIL}"
        gh auth setup-git
        echo "::endgroup::"

    # Render only the new version's changelog section first, before any
    # changelog-commit appears in the unreleased range. This is what becomes
    # the body of the GitHub Release.
    - name: Render release notes (this version only)
      id: notes
      shell: bash
      env:
        NEXT_TAG: ${{ inputs.tag_major_minor_patch }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        notes_path="${RUNNER_TEMP:-/tmp}/release-notes-${NEXT_TAG}.md"
        # --unreleased: only commits since the most recent tag.
        # --tag: render that unreleased section under NEXT_TAG instead of
        #        "[unreleased]" so the heading in the release body is correct.
        # --strip header: drop the top-of-changelog header so the body
        #        contains only the version section.
        npx git-cliff \
          --tag "${NEXT_TAG}" \
          --unreleased \
          --strip header \
          --output "${notes_path}"

        echo "path=${notes_path}" >> "${GITHUB_OUTPUT}"

        {
          echo "# ${NEXT_TAG} Release Notes"
          cat "${notes_path}"
        } >> "${GITHUB_STEP_SUMMARY}"

        echo "::group::${NEXT_TAG} release notes"
        cat "${notes_path}"
        echo "::endgroup::"

    # Capture pre-release state so the rollback step can restore it if a later
    # step in THIS action fails. Read-only; runs before anything is mutated.
    - name: Capture pre-release state
      id: rollback_state
      shell: bash
      env:
        TAG_MAJOR: ${{ inputs.tag_major }}
        TAG_MAJOR_MINOR: ${{ inputs.tag_major_minor }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        echo "::group::Capture pre-release state (for rollback)"
        # Prior remote target of each floating tag (empty when it does not
        # exist yet). The patch tag is brand-new, so it is not captured: on
        # rollback it is simply deleted.
        echo "tag_major_sha=$(git ls-remote origin "refs/tags/${TAG_MAJOR}" | awk 'NR==1{print $1}')" >> "${GITHUB_OUTPUT}"
        echo "tag_major_minor_sha=$(git ls-remote origin "refs/tags/${TAG_MAJOR_MINOR}" | awk 'NR==1{print $1}')" >> "${GITHUB_OUTPUT}"
        echo "::endgroup::"

    # Prepend the same version section to the persistent CHANGELOG.md so the
    # file accumulates one entry per release (newest on top, matching the
    # repository's cliff.toml template).
    - name: Update CHANGELOG.md
      shell: bash
      env:
        CHANGELOG_FILE: ${{ inputs.changelog_file || env.UPDATE_FILE_CHANGELOG }}
        NEXT_TAG: ${{ inputs.tag_major_minor_patch }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        echo "::group::Prepend ${NEXT_TAG} section to ${CHANGELOG_FILE}"
        if [[ ! -f "${CHANGELOG_FILE}" ]]; then
          touch "${CHANGELOG_FILE}"
        fi
        npx git-cliff \
          --tag "${NEXT_TAG}" \
          --unreleased \
          --prepend "${CHANGELOG_FILE}"
        echo "::endgroup::"

    - name: Update Version Files
      shell: bash
      env:
        NEXT_VERSION: ${{ inputs.tag_major_minor_patch }}
        CHART_VERSION_FILE: ${{ inputs.chart_version_file || env.UPDATE_FILE_CHART_VERSION }}
        CHART_APP_VERSION_FILE: ${{ inputs.chart_app_version_file || env.UPDATE_FILE_CHART_APP_VERSION }}
        JEKYLL_CONFIG_FILE: ${{ inputs.jekyll_config_file || env.UPDATE_FILE_JEKYLL_CONFIG }}
        PACKAGE_JSON_FILE: ${{ env.UPDATE_FILE_PACKAGE_JSON }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        echo "::group::Update version files"
        if [[ -f ".version" ]] || [[ -L ".version" ]]; then
          echo "Updating .version file to ${NEXT_VERSION#v}"
          echo "${NEXT_VERSION#v}" > .version
          git add .version
        fi

        # split by `,` and loop each CHART_VERSION_FILE
        IFS=',' read -ra CHART_VERSION_FILES <<< "${CHART_VERSION_FILE}"
        for file in "${CHART_VERSION_FILES[@]}"; do
          if [[ -f "$file" ]] || [[ -L "$file" ]]; then
            echo "Updating $file version to ${NEXT_VERSION#v}"
            yq eval --inplace ".version = \"${NEXT_VERSION#v}\"" "$file"
            git add "$file"
          fi
        done

        # split by `,` and loop each CHART_APP_VERSION_FILE
        IFS=',' read -ra CHART_APP_VERSION_FILES <<< "${CHART_APP_VERSION_FILE}"
        for file in "${CHART_APP_VERSION_FILES[@]}"; do
          if [[ -f "$file" ]] || [[ -L "$file" ]]; then
            echo "Updating $file appVersion to ${NEXT_VERSION#v}"
            yq eval --inplace ".appVersion = \"${NEXT_VERSION#v}\"" "$file"
            git add "$file"
          fi
        done

        # split by `,` and loop each PACKAGE_JSON_FILE
        IFS=',' read -ra PACKAGE_JSON_FILES <<< "${PACKAGE_JSON_FILE}"
        for file in "${PACKAGE_JSON_FILES[@]}"; do
          if [[ -f "$file" ]] || [[ -L "$file" ]]; then
            echo "Updating $file version to ${NEXT_VERSION#v}"
            yq eval --inplace ".version = \"${NEXT_VERSION#v}\"" "$file"
            git add "$file"
          fi
        done

        # split by `,` and loop each JEKYLL_CONFIG_FILE
        IFS=',' read -ra JEKYLL_CONFIG_FILES <<< "${JEKYLL_CONFIG_FILE}"
        for file in "${JEKYLL_CONFIG_FILES[@]}"; do
          if [[ -f "$file" ]] || [[ -L "$file" ]]; then
            echo "Updating $file version to ${NEXT_VERSION#v}"
            yq eval --inplace ".version = \"${NEXT_VERSION#v}\"" "$file"
            git add "$file"
          fi
        done
        echo "::endgroup::"

    - name: Commit Release Changes
      id: commit
      shell: bash
      env:
        CHANGELOG_FILE: ${{ inputs.changelog_file || env.UPDATE_FILE_CHANGELOG }}
        NEXT_TAG: ${{ inputs.tag_major_minor_patch }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        echo "::group::Commit Changelog updates"
        git add -- "${CHANGELOG_FILE}"

        if git diff --cached --quiet; then
          echo "No changelog changes to commit."
          echo "committed=false" >> "${GITHUB_OUTPUT}"
          exit 0
        fi
        echo "::endgroup::"

        echo "::group::Commit and push release updates"
        git commit -m "chore(release): update changelog for ${NEXT_TAG}"
        git push origin "HEAD:${GITHUB_REF_NAME}"
        echo "committed=true" >> "${GITHUB_OUTPUT}"
        echo "::endgroup::"

    - name: Replace tags
      shell: bash
      id: tags
      env:
        TAG_MAJOR: ${{ inputs.tag_major }}
        TAG_MAJOR_MINOR: ${{ inputs.tag_major_minor }}
        TAG_MAJOR_MINOR_PATCH: ${{ inputs.tag_major_minor_patch }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        echo "started=true" >> "${GITHUB_OUTPUT}"

        # Only delete and move floating tags (Major and Minor)
        echo "::group::Moving floating tags ${TAG_MAJOR}, ${TAG_MAJOR_MINOR}"
        for tag in "${TAG_MAJOR}" "${TAG_MAJOR_MINOR}"; do
          git tag -d "${tag}" 2>/dev/null || true
          git push origin ":refs/tags/${tag}" 2>/dev/null || true
        done

        # Re-create floating tags at current HEAD
        for tag in "${TAG_MAJOR}" "${TAG_MAJOR_MINOR}"; do
          git tag "${tag}"
        done

        # Create the immutable patch tag ONLY if it doesn't exist yet
        # This prevents rewriting it if it is already locked
        if ! git rev-parse "${TAG_MAJOR_MINOR_PATCH}" >/dev/null 2>&1; then
          git tag "${TAG_MAJOR_MINOR_PATCH}"
        fi

        # Push everything up
        git push origin "${TAG_MAJOR}" "${TAG_MAJOR_MINOR}" "${TAG_MAJOR_MINOR_PATCH}"
        echo "pushed=true" >> "${GITHUB_OUTPUT}"
        echo "::endgroup::"

    - name: Create GitHub Release
      id: gh_release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        NEXT_TAG: ${{ inputs.tag_major_minor_patch }}
        NOTES_PATH: ${{ steps.notes.outputs.path }}
        PRERELEASE: ${{ inputs.prerelease }}
        DRAFT: ${{ inputs.draft }}
      run: |
        set -euo pipefail
        echo "::group::Create GitHub Release ${NEXT_TAG}"
        # Delete an existing release for this tag (if any) so we can create
        # a fresh one whose body reflects the just-generated notes.
        gh release delete "${NEXT_TAG}" --yes 2>/dev/null || true

        flags=()
        [[ "${PRERELEASE}" == "true" ]] && flags+=(--prerelease)
        [[ "${DRAFT}" == "true" ]] && flags+=(--draft)

        url="$(
          gh release create "${NEXT_TAG}" \
            --title "${NEXT_TAG}" \
            --notes-file "${NOTES_PATH}" \
            --target "$(git rev-parse HEAD)" \
            "${flags[@]}"
        )"
        echo "url=${url}" >> "${GITHUB_OUTPUT}"
        echo "::endgroup::"

    # Atomic rollback: if any step ABOVE in this action failed, undo whatever
    # was already pushed (GitHub Release, tags, commit) in reverse order.
    # NOTE: only fires on failures WITHIN this action. It cannot detect a
    # failure in a step that runs after this action in the calling workflow —
    # gate those (e.g. marketplace publish) on success() and they will skip.
    - name: Rollback on failure
      if: ${{ failure() }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GITHUB_TOKEN: ${{ inputs.token }}
        TAG_MAJOR: ${{ inputs.tag_major }}
        TAG_MAJOR_MINOR: ${{ inputs.tag_major_minor }}
        NEXT_TAG: ${{ inputs.tag_major_minor_patch }}
        ORIG_TAG_MAJOR_SHA: ${{ steps.rollback_state.outputs.tag_major_sha }}
        ORIG_TAG_MAJOR_MINOR_SHA: ${{ steps.rollback_state.outputs.tag_major_minor_sha }}
        COMMITTED: ${{ steps.commit.outputs.committed }}
        TAGS_STARTED: ${{ steps.tags.outputs.started }}
      run: |
        set -uo pipefail
        echo "::warning::Release failed — rolling back pushed changes"
        echo "::group::Rollback"

        # 1) Delete the GitHub Release (no-op if one was never created).
        echo "Ensuring GitHub Release ${NEXT_TAG} is removed"
        gh release delete "${NEXT_TAG}" --yes 2>/dev/null || true

        # 2) Undo tags only if tag mutation began.
        if [[ "${TAGS_STARTED}" == "true" ]]; then
          # Patch tag is brand-new for this release: delete it.
          echo "Deleting patch tag ${NEXT_TAG}"
          git push origin ":refs/tags/${NEXT_TAG}" 2>/dev/null || true

          # Floating tags were moved: restore to prior target, or delete if
          # they did not exist before this release.
          for pair in "${TAG_MAJOR}=${ORIG_TAG_MAJOR_SHA}" "${TAG_MAJOR_MINOR}=${ORIG_TAG_MAJOR_MINOR_SHA}"; do
            tag="${pair%%=*}"
            sha="${pair#*=}"
            if [[ -n "${sha}" ]]; then
              echo "Restoring ${tag} -> ${sha}"
              git push origin --force "${sha}:refs/tags/${tag}" 2>/dev/null || true
            else
              echo "Deleting ${tag} (did not exist before release)"
              git push origin ":refs/tags/${tag}" 2>/dev/null || true
            fi
          done
        fi

        # 3) Revert the release commit if it was pushed. A revert keeps history
        #    and works under branch protection that forbids force-push.
        #    Local HEAD is still the release commit (no further commits made).
        if [[ "${COMMITTED}" == "true" ]]; then
          echo "Reverting release commit on ${GITHUB_REF_NAME}"
          git revert --no-edit HEAD
          git push origin "HEAD:${GITHUB_REF_NAME}"
        fi
        echo "::endgroup::"

    - name: Summary
      shell: bash
      env:
        TAG_MAJOR: ${{ inputs.tag_major }}
        TAG_MAJOR_MINOR: ${{ inputs.tag_major_minor }}
        TAG_MAJOR_MINOR_PATCH: ${{ inputs.tag_major_minor_patch }}
        CHANGELOG_COMMITTED: ${{ steps.commit.outputs.committed }}
        RELEASE_URL: ${{ steps.gh_release.outputs.url }}
      run: |
        {
          echo "### Release"
          echo ""
          echo "- Tag (major): \`${TAG_MAJOR}\`"
          echo "- Tag (minor): \`${TAG_MAJOR_MINOR}\`"
          echo "- Tag (patch): \`${TAG_MAJOR_MINOR_PATCH}\`"
          echo ""
          echo "- Changelog committed: \`${CHANGELOG_COMMITTED:-false}\`"
          echo "- Release: ${RELEASE_URL:-n/a}"
        } >> "${GITHUB_STEP_SUMMARY}"
