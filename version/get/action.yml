---
name: Get Next Version
description: >
  Calculate the next semantic version using git-cliff based on conventional
  commit history since the last tag for a configurable release stream, and
  expose the version in plain and tagged forms.
inputs:
  tag_prefix:
    description: >
      Prefix used to identify and emit tags for this release stream.
      Only fully-qualified MAJOR.MINOR.PATCH tags with this prefix participate
      in version discovery.
    required: false
    default: 'v'
  default_version:
    description: >
      Fallback version, optionally including tag_prefix, to use when no prior
      tags exist or when git-cliff cannot determine a bumped version.
    required: false
    default: 'v0.1.0'
  fail_on_default:
    description: >
      When 'true', fail the action if the computed next version equals
      default_version and that tag already exists in the repository.
      This catches cases where version detection broke (e.g. shallow clone,
      no conventional commits) rather than silently re-tagging with the default.
    required: false
    default: 'false'
  fail_on_same_version:
    description: >
      When 'true', fail the action if next_version equals current_version and
      the full patch tag for tag_prefix already exists. Floating tags may be
      recreated safely, but re-applying an existing patch tag means version
      detection broke (e.g. squash merge commit not parsed as conventional).
    required: false
    default: 'true'
  enable_pr_comment:
    description: >
      When 'true', post (or update) a pull-request comment containing the
      version summary table. The comment is identified by an HTML marker so
      it is replaced rather than duplicated on re-runs. Has no effect on
      non-pull-request events. Can also be enabled by setting the
      ENABLE_PR_COMMENT environment variable to 'true' at the job or workflow level.
    required: false
    default: 'false'
  token:
    description: >
      GitHub token used to post or update the PR comment.
      Only required when enable_pr_comment is 'true'.
    required: false
    default: '${{ github.token }}'
outputs:
  current_version:
    description: 'The most recent matching stream tag without tag_prefix (e.g. 1.2.3).'
    value: ${{ steps.compute.outputs.current_version }}
  next_version:
    description: 'The next version determined by git-cliff without tag_prefix (e.g. 1.2.4).'
    value: ${{ steps.compute.outputs.next_version }}
  major:
    description: 'Major component of next_version (e.g. 1).'
    value: ${{ steps.compute.outputs.major }}
  major_minor:
    description: 'Major.Minor of next_version (e.g. 1.2).'
    value: ${{ steps.compute.outputs.major_minor }}
  major_minor_patch:
    description: 'Full Major.Minor.Patch of next_version (e.g. 1.2.4).'
    value: ${{ steps.compute.outputs.major_minor_patch }}
  tag_major:
    description: 'Major tag form with tag_prefix (e.g. v1 or gateway-v1).'
    value: ${{ steps.compute.outputs.tag_major }}
  tag_major_minor:
    description: 'Major.Minor tag form with tag_prefix (e.g. v1.2 or gateway-v1.2).'
    value: ${{ steps.compute.outputs.tag_major_minor }}
  tag_major_minor_patch:
    description: 'Full tag form with tag_prefix (e.g. v1.2.4 or gateway-v1.2.4).'
    value: ${{ steps.compute.outputs.tag_major_minor_patch }}
runs:
  using: "composite"
  steps:
    - name: Check for .nvmrc
      id: nvmrc_check
      shell: bash
      run: |
        if [[ -f ".nvmrc" ]]; then
          echo "exists=true" >> "${GITHUB_OUTPUT}"
        else
          echo "exists=false" >> "${GITHUB_OUTPUT}"
        fi

    - uses: actions/setup-node@v6
      if: steps.nvmrc_check.outputs.exists == 'true'
      with:
        node-version-file: '.nvmrc'

    - uses: actions/setup-node@v6
      if: steps.nvmrc_check.outputs.exists == 'false'
      with:
        node-version: 'latest'

    - name: Install dependencies
      shell: bash
      run: |
        npm install --global git-cliff

    - name: Install xget
      uses: camalot/xget-action@v1
      with:
        package: caarlos0/svu
        ignore: |
          .sbom.json

    - name: Compute versions
      id: compute
      shell: bash
      env:
        DEFAULT_VERSION: ${{ inputs.default_version }}
        FAIL_ON_DEFAULT: ${{ inputs.fail_on_default }}
        FAIL_ON_SAME_VERSION: ${{ inputs.fail_on_same_version }}
        TAG_PREFIX: ${{ inputs.tag_prefix }}
      run: |
        bash "${GITHUB_ACTION_PATH}/compute.sh"

    - name: Summary
      shell: bash
      env:
        CV: "${{ steps.compute.outputs.current_version }}"
        NV: "${{ steps.compute.outputs.next_version }}"
        TMJ: "${{ steps.compute.outputs.tag_major }}"
        TMJM: "${{ steps.compute.outputs.tag_major_minor }}"
        TMJMP: "${{ steps.compute.outputs.tag_major_minor_patch }}"
        MJ: "${{ steps.compute.outputs.major }}"
        MJM: "${{ steps.compute.outputs.major_minor }}"
        MJMP: "${{ steps.compute.outputs.major_minor_patch }}"
      run: |
        {
          echo "### Version Determination"
          echo ""
          echo "| Field | Value |"
          echo "| --- | --- |"
          echo "| Current Version | $CV |"
          echo "| Next Version | $NV |"
          echo "| Major | $MJ |"
          echo "| Major.Minor | $MJM |"
          echo "| Major.Minor.Patch | $MJMP |"
          echo "| Tag Major | $TMJ |"
          echo "| Tag Major.Minor | $TMJM |"
          echo "| Tag Major.Minor.Patch | $TMJMP |"
        } >> "${GITHUB_STEP_SUMMARY}"

    - name: Write PR comment body
      if: github.event_name == 'pull_request' && (inputs.enable_pr_comment == 'true' || env.ENABLE_PR_COMMENT == 'true')
      shell: bash
      env:
        CV: "${{ steps.compute.outputs.current_version }}"
        NV: "${{ steps.compute.outputs.next_version }}"
        TMJ: "${{ steps.compute.outputs.tag_major }}"
        TMJM: "${{ steps.compute.outputs.tag_major_minor }}"
        TMJMP: "${{ steps.compute.outputs.tag_major_minor_patch }}"
        MJ: "${{ steps.compute.outputs.major }}"
        MJM: "${{ steps.compute.outputs.major_minor }}"
        MJMP: "${{ steps.compute.outputs.major_minor_patch }}"
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        {
          echo "<!-- version-get-report -->"
          echo "### Version Determination · [Details →]($RUN_URL)"
          echo ""
          echo "| Field | Value |"
          echo "| --- | --- |"
          echo "| Current Version | $CV |"
          echo "| Next Version | $NV |"
          echo "| Major | $MJ |"
          echo "| Major.Minor | $MJM |"
          echo "| Major.Minor.Patch | $MJMP |"
          echo "| Tag Major | $TMJ |"
          echo "| Tag Major.Minor | $TMJM |"
          echo "| Tag Major.Minor.Patch | $TMJMP |"
        } > /tmp/version-get-comment.md

    - name: Find existing Version comment
      if: github.event_name == 'pull_request' && (inputs.enable_pr_comment == 'true' || env.ENABLE_PR_COMMENT == 'true')
      uses: peter-evans/find-comment@v4
      id: find_comment
      with:
        issue-number: ${{ github.event.pull_request.number }}
        body-includes: "<!-- version-get-report -->"
        token: ${{ inputs.token }}

    - name: Post or Update PR comment
      if: github.event_name == 'pull_request' && (inputs.enable_pr_comment == 'true' || env.ENABLE_PR_COMMENT == 'true')
      uses: peter-evans/create-or-update-comment@v5
      with:
        comment-id: ${{ steps.find_comment.outputs.comment-id }}
        issue-number: ${{ github.event.pull_request.number }}
        body-path: /tmp/version-get-comment.md
        edit-mode: replace
        token: ${{ inputs.token }}
