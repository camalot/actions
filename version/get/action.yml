---
name: Get Next Version
description: >
  Calculate the next semantic version using git-cliff based on conventional
  commit history since the last tag, and expose the version in several forms
  (plain and v-prefixed; major, major.minor, major.minor.build).
inputs:
  default_version:
    description: >
      Fallback version (with the leading 'v') to use when no prior tags exist
      or when git-cliff cannot determine a bumped version.
    required: false
    default: 'v0.1.0'
  fail_on_default:
    description: >
      When 'true', fail the action if the computed next version equals
      default_version and that tag already exists in the repository.
      This catches cases where version detection broke (e.g. shallow clone,
      no conventional commits) rather than silently re-tagging with the default.
    required: false
    default: 'false'
  ENABLE_PR_COMMENT:
    description: >
      When 'true', post (or update) a pull-request comment containing the
      version summary table. The comment is identified by an HTML marker so
      it is replaced rather than duplicated on re-runs. Has no effect on
      non-pull-request events. Can also be enabled by setting the
      ENABLE_PR_COMMENT environment variable to 'true' at the job or workflow level.
    required: false
    default: 'false'
  token:
    description: >
      GitHub token used to post or update the PR comment.
      Only required when enable_pr_comment is 'true'.
    required: false
    default: '${{ github.token }}'
outputs:
  current_version:
    description: 'The most recent v* tag found in the repo, without leading "v" (e.g. 1.2.3).'
    value: ${{ steps.compute.outputs.current_version }}
  next_version:
    description: 'The next version determined by git-cliff, without leading "v" (e.g. 1.2.4).'
    value: ${{ steps.compute.outputs.next_version }}
  major:
    description: 'Major component of next_version (e.g. 1).'
    value: ${{ steps.compute.outputs.major }}
  major_minor:
    description: 'Major.Minor of next_version (e.g. 1.2).'
    value: ${{ steps.compute.outputs.major_minor }}
  major_minor_patch:
    description: 'Full Major.Minor.Patch of next_version (e.g. 1.2.4).'
    value: ${{ steps.compute.outputs.major_minor_patch }}
  tag_major:
    description: 'Major tag form with "v" prefix (e.g. v1).'
    value: ${{ steps.compute.outputs.tag_major }}
  tag_major_minor:
    description: 'Major.Minor tag form with "v" prefix (e.g. v1.2).'
    value: ${{ steps.compute.outputs.tag_major_minor }}
  tag_major_minor_patch:
    description: 'Full tag form with "v" prefix (e.g. v1.2.4).'
    value: ${{ steps.compute.outputs.tag_major_minor_patch }}
runs:
  using: "composite"
  steps:
    - name: Check for .nvmrc
      id: nvmrc_check
      shell: bash
      run: |
        if [[ -f ".nvmrc" ]]; then
          echo "exists=true" >> "${GITHUB_OUTPUT}"
        else
          echo "exists=false" >> "${GITHUB_OUTPUT}"
        fi

    - uses: actions/setup-node@v6
      if: steps.nvmrc_check.outputs.exists == 'true'
      with:
        node-version-file: '.nvmrc'

    - uses: actions/setup-node@v6
      if: steps.nvmrc_check.outputs.exists == 'false'
      with:
        node-version: 'latest'

    - name: Install dependencies
      shell: bash
      run: |
        npm install --global git-cliff

    - name: Compute versions
      id: compute
      shell: bash
      env:
        DEFAULT_VERSION: ${{ inputs.default_version }}
        FAIL_ON_DEFAULT: ${{ inputs.fail_on_default }}
      run: |
        set -euo pipefail

        # Normalize default: accept with or without leading 'v'.
        DEFAULT_WITH_V="v${DEFAULT_VERSION#v}"
        DEFAULT_PLAIN="${DEFAULT_VERSION#v}"

        # Match only fully-qualified vMAJOR.MINOR.PATCH tags so that floating
        # tags (v1, v1.1) at the same commit are never returned as CURRENT_VERSION.
        # Without this, git describe may return v1 or v1.1 and git-cliff then
        # computes a wrong base, silently falling back to the default.
        CURRENT_VERSION="$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --abbrev=0 2>/dev/null)"
        HAS_TAGS="false"
        if [[ -n "${CURRENT_VERSION}" ]]; then
          HAS_TAGS="true"
        else
          CURRENT_VERSION="${DEFAULT_WITH_V}"
        fi
        CURRENT_PLAIN="${CURRENT_VERSION#v}"

        # Scope git-cliff to exactly CURRENT_VERSION..HEAD so it is unaffected
        # by floating tags that may sit at the same commit as CURRENT_VERSION.
        # --offline prevents any GitHub/GitLab API calls.
        # Normalize the output: git-cliff may return the version with or without
        # the leading 'v' depending on its config; always canonicalize to 'v' form.
        NEXT_RAW="$(npx git-cliff "${CURRENT_VERSION}..HEAD" --bumped-version --offline 2>/dev/null || true)"
        NEXT_VERSION="v${NEXT_RAW#v}"

        # When git-cliff returns nothing (no bump-triggering commits in the range,
        # empty range, or other non-fatal failure), fall back gracefully:
        #   - Real tags exist → patch-bump CURRENT_VERSION (returning a version
        #     lower than current would be wrong, and the default is unrelated).
        #   - No tags at all  → use DEFAULT_VERSION (genuine first-release case).
        if [[ "${NEXT_VERSION}" == "v" ]]; then
          if [[ "${HAS_TAGS}" == "true" ]]; then
            MAJOR_C="$(echo "${CURRENT_PLAIN}" | cut -d. -f1)"
            MINOR_C="$(echo "${CURRENT_PLAIN}" | cut -d. -f2)"
            PATCH_C="$(echo "${CURRENT_PLAIN}" | cut -d. -f3)"
            NEXT_VERSION="v${MAJOR_C}.${MINOR_C}.$((PATCH_C + 1))"
          else
            NEXT_VERSION="${DEFAULT_WITH_V}"
          fi
        fi

        NEXT_PLAIN="${NEXT_VERSION#v}"

        # Guard: fail when the computed next version equals the default and we are
        # not in a genuine first-release scenario. Both sides are compared without
        # the leading 'v' so "v1.0.0" and "1.0.0" are treated as identical.
        if [[ "${FAIL_ON_DEFAULT}" == "true" && "${NEXT_PLAIN}" == "${DEFAULT_PLAIN}" ]]; then
          if [[ "${HAS_TAGS}" == "true" ]]; then
            # Real version history exists but we still computed the default —
            # this means version detection broke (e.g. no conventional commits).
            echo "::error::Computed next version is the default (${DEFAULT_WITH_V}), but the repository already has tags beyond it (current: ${CURRENT_VERSION}). Check that commits follow Conventional Commits format."
            exit 1
          fi
          # Genuine first-release scenario: still fail if the default tag already
          # exists — it would be a duplicate tag.
          if git tag --list | grep -qFx "${DEFAULT_WITH_V}"; then
            echo "::error::Computed next version is the default (${DEFAULT_WITH_V}), but that tag already exists. Check that fetch-depth: 0 is set and commits follow Conventional Commits format."
            exit 1
          fi
        fi

        MAJOR="$(echo "${NEXT_PLAIN}" | cut -d. -f1)"
        MAJOR_MINOR="$(echo "${NEXT_PLAIN}" | cut -d. -f1-2)"
        MAJOR_MINOR_PATCH="$(echo "${NEXT_PLAIN}" | cut -d. -f1-3)"

        {
          echo "current_version=${CURRENT_PLAIN}"
          echo "next_version=${NEXT_PLAIN}"
          echo "major=${MAJOR}"
          echo "major_minor=${MAJOR_MINOR}"
          echo "major_minor_patch=${MAJOR_MINOR_PATCH}"
          echo "tag_major=v${MAJOR}"
          echo "tag_major_minor=v${MAJOR_MINOR}"
          echo "tag_major_minor_patch=v${MAJOR_MINOR_PATCH}"
        } >> "${GITHUB_OUTPUT}"

    - name: Summary
      shell: bash
      env:
        CV: "${{ steps.compute.outputs.current_version }}"
        NV: "${{ steps.compute.outputs.next_version }}"
        TMJ: "${{ steps.compute.outputs.tag_major }}"
        TMJM: "${{ steps.compute.outputs.tag_major_minor }}"
        TMJMP: "${{ steps.compute.outputs.tag_major_minor_patch }}"
        MJ: "${{ steps.compute.outputs.major }}"
        MJM: "${{ steps.compute.outputs.major_minor }}"
        MJMP: "${{ steps.compute.outputs.major_minor_patch }}"
      run: |
        {
          echo "### Version Determination"
          echo ""
          echo "| Field | Value |"
          echo "| --- | --- |"
          echo "| current_version | $CV |"
          echo "| next_version | $NV |"
          echo "| major | $MJ |"
          echo "| major_minor | $MJM |"
          echo "| major_minor_patch | $MJMP |"
          echo "| tag_major | $TMJ |"
          echo "| tag_major_minor | $TMJM |"
          echo "| tag_major_minor_patch | $TMJMP |"
        } >> "${GITHUB_STEP_SUMMARY}"

    - name: Write PR comment body
      if: github.event_name == 'pull_request' && (inputs.enable_pr_comment == 'true' || env.ENABLE_PR_COMMENT == 'true')
      shell: bash
      env:
        CV: "${{ steps.compute.outputs.current_version }}"
        NV: "${{ steps.compute.outputs.next_version }}"
        TMJ: "${{ steps.compute.outputs.tag_major }}"
        TMJM: "${{ steps.compute.outputs.tag_major_minor }}"
        TMJMP: "${{ steps.compute.outputs.tag_major_minor_patch }}"
        MJ: "${{ steps.compute.outputs.major }}"
        MJM: "${{ steps.compute.outputs.major_minor }}"
        MJMP: "${{ steps.compute.outputs.major_minor_patch }}"
      run: |
        {
          echo "<!-- version-get-report -->"
          echo "### Version Determination"
          echo ""
          echo "| Field | Value |"
          echo "| --- | --- |"
          echo "| current_version | $CV |"
          echo "| next_version | $NV |"
          echo "| major | $MJ |"
          echo "| major_minor | $MJM |"
          echo "| major_minor_patch | $MJMP |"
          echo "| tag_major | $TMJ |"
          echo "| tag_major_minor | $TMJM |"
          echo "| tag_major_minor_patch | $TMJMP |"
        } > /tmp/version-get-comment.md

    - name: Find existing Version comment
      if: github.event_name == 'pull_request' && (inputs.enable_pr_comment == 'true' || env.ENABLE_PR_COMMENT == 'true')
      uses: peter-evans/find-comment@v4
      id: find_comment
      with:
        issue-number: ${{ github.event.pull_request.number }}
        body-includes: "<!-- version-get-report -->"
        token: ${{ inputs.token }}

    - name: Post or Update PR comment
      if: github.event_name == 'pull_request' && (inputs.enable_pr_comment == 'true' || env.ENABLE_PR_COMMENT == 'true')
      uses: peter-evans/create-or-update-comment@v5
      with:
        comment-id: ${{ steps.find_comment.outputs.comment-id }}
        issue-number: ${{ github.event.pull_request.number }}
        body-path: /tmp/version-get-comment.md
        edit-mode: replace
        token: ${{ inputs.token }}
